<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Location Monitor Component</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --color-bg-primary: #050505;
            --color-bg-secondary: #0a0a0a;
            --color-bg-card: rgba(255, 255, 255, 0.02);
            --color-border: rgba(255, 255, 255, 0.08);
            --color-border-hover: rgba(255, 255, 255, 0.15);
            --color-text-primary: #ffffff;
            --color-text-secondary: rgba(255, 255, 255, 0.6);
            --color-text-tertiary: rgba(255, 255, 255, 0.4);
            --color-text-muted: rgba(255, 255, 255, 0.3);
            --color-accent: #38bdf8;
            --color-accent-dim: rgba(56, 189, 248, 0.1);
            --color-accent-border: rgba(56, 189, 248, 0.25);
            --color-danger: #ef4444;
            --color-success: #4ade80;
            --color-warning: #fbbf24;
            --font-primary: 'Inter', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --font-mono: 'Fira Code', monospace;
            --transition-normal: 0.3s ease;
            --border-radius-lg: 12px;
            --border-radius-md: 8px;
            --border-radius-sm: 4px;
        }

        body {
            background-color: var(--color-bg-primary);
            color: var(--color-text-primary);
            font-family: var(--font-primary);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .component-wrapper {
            max-width: 1000px;
            width: 100%;
        }

        .monitor-card {
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius-lg);
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .header-group {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .monitor-label {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(56, 189, 248, 0.06);
            border: 1px solid rgba(56, 189, 248, 0.15);
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--color-accent);
            margin-bottom: 8px;
        }

        .monitor-title {
            font-family: var(--font-display);
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        .monitor-desc {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin: 0;
        }

        .interface-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            background: #0c0c14;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--border-radius-md);
            overflow: hidden;
            height: 550px;
        }

        /* Sidebar */
        .sidebar {
            background: rgba(15, 15, 20, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius-sm);
            padding: 8px 12px;
            color: #fff;
            font-size: 12px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }

        .asset-list {
            flex: 1;
            overflow-y: auto;
        }

        .asset-item {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .asset-item:hover { background: rgba(255, 255, 255, 0.02); }
        .asset-item.active { background: rgba(56, 189, 248, 0.04); }

        .asset-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .asset-id {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 13px;
        }

        .status-badge {
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-dot { width: 5px; height: 5px; border-radius: 50%; }

        /* Notification */
        .notification-pill {
            margin-top: 8px;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 10px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: var(--color-danger);
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .notification-pill.visible { display: block; }

        /* Map */
        .map-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #map { flex: 1; background: #0f0f13; }

        /* Overlay Controls */
        .map-overlay {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 1000;
            background: rgba(10, 10, 12, 0.9);
            padding: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px;
            backdrop-filter: blur(10px);
        }

        .layer-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: var(--color-text-secondary);
            margin-bottom: 8px;
            cursor: pointer;
        }

        .layer-toggle:last-child { margin-bottom: 0; }
        .layer-toggle input { accent-color: var(--color-accent); }

        /* Timeline Footer */
        .timeline-container {
            background: rgba(15, 15, 20, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px 24px;
            z-index: 1001;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-family: var(--font-mono);
            color: var(--color-text-muted);
            margin-bottom: 8px;
        }

        .timeline-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--color-accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--color-accent);
            cursor: pointer;
        }

        .coord-box {
            position: absolute;
            bottom: 90px;
            left: 16px;
            z-index: 1000;
            background: rgba(0,0,0,0.6);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-family: var(--font-mono);
            color: var(--color-accent);
        }

        /* Marker Styles */
        .custom-pin { background: transparent; }
        .pin-inner {
            width: 12px; height: 12px;
            background: var(--color-accent);
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--color-accent);
        }
        .pin-inner.breached {
            background: var(--color-danger);
            box-shadow: 0 0 15px var(--color-danger);
            animation: pulse-danger 1s infinite;
        }
        .pin-label {
            position: absolute;
            top: -20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            padding: 2px 6px; border-radius: 3px;
            font-size: 9px; color: #fff; font-family: var(--font-mono);
            white-space: nowrap;
        }

        @keyframes pulse-danger {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 768px) {
            .interface-container { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        }
    </style>
</head>
<body>

    <div class="component-wrapper">
        <div class="monitor-card">
            <div class="header-group">
                <div>
                    <span class="monitor-label">Geospatial Monitor</span>
                    <h3 class="monitor-title">Operational Asset Intelligence</h3>
                    <p class="monitor-desc">Real-time telemetry, historical replay, and geofence enforcement.</p>
                </div>
            </div>

            <div class="interface-container">
                <div class="sidebar">
                    <div class="sidebar-header">
                        <input type="text" class="search-bar" placeholder="Search assets...">
                    </div>
                    <div class="asset-list" id="asset-list">
                        <!-- JS Rendered -->
                    </div>
                </div>

                <div class="map-wrapper">
                    <div id="map"></div>
                    
                    <div class="map-overlay">
                        <div style="font-size:9px; font-weight:700; color:#fff; margin-bottom:8px; text-transform:uppercase; letter-spacing:1px;">Layer Control</div>
                        <label class="layer-toggle">
                            <input type="checkbox" checked id="toggle-assets"> Assets
                        </label>
                        <label class="layer-toggle">
                            <input type="checkbox" checked id="toggle-geofence"> Restricted Zones
                        </label>
                        <label class="layer-toggle">
                            <input type="checkbox" checked id="toggle-history"> History Path
                        </label>
                    </div>

                    <div class="coord-box" id="coords">32.8998° N, 97.0403° W</div>

                    <div class="timeline-container">
                        <div class="timeline-header">
                            <span id="timeline-time">TIMESTAMP: 08:00:00</span>
                            <span style="color:var(--color-accent)">REPLAY ACTIVE</span>
                        </div>
                        <input type="range" class="timeline-slider" id="timeline" min="0" max="100" value="0">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const map = L.map('map', {
                center: [32.8960, -97.0400],
                zoom: 14,
                zoomControl: false,
                attributionControl: false
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

            // 1. Data Definitions
            const assets = [
                { id: 'AssetTracker8', status: 'Online', loc: 'Terminal D', lat: 32.9025, lng: -97.0450, color: 'var(--color-success)' },
                { id: 'AssetTracker1', status: 'Online', loc: 'Cargo Bay 3', lat: 32.8870, lng: -97.0510, color: 'var(--color-success)' },
                { id: 'AssetTracker3', status: 'Idle', loc: 'Gate A12', lat: 32.9080, lng: -97.0390, color: 'var(--color-warning)' },
                { id: 'AssetTracker5', status: 'Online', loc: 'Hangar 4', lat: 32.9150, lng: -97.0400, color: 'var(--color-success)' }
            ];

            // 2. Historical Asset Tracker 6 Path
            // Starts inside the restricted zone and moves out
            const historyPath = [
                [32.8920, -97.0280], [32.8930, -97.0285], [32.8940, -97.0290], // Deep inside
                [32.8955, -97.0310], [32.8965, -97.0330], // Crossing line
                [32.8980, -97.0360], [32.9000, -97.0400], [32.9020, -97.0430]  // Safe zone
            ];

            const geofenceCoords = [
                [32.8960, -97.0350], [32.8960, -97.0250],
                [32.8900, -97.0250], [32.8900, -97.0350]
            ];

            // 3. Layer Management
            const assetGroup = L.layerGroup().addTo(map);
            const historyGroup = L.layerGroup().addTo(map);
            const geofence = L.polygon(geofenceCoords, {
                color: 'var(--color-danger)',
                fillColor: 'var(--color-danger)',
                fillOpacity: 0.1,
                weight: 1.5,
                dashArray: '5, 10'
            }).addTo(map);

            // Restricted Zone UI logic
            const checkGeofence = (latlng) => {
                const polygon = geofence;
                let inside = false;
                const x = latlng[0], y = latlng[1];
                for (let i = 0, j = geofenceCoords.length - 1; i < geofenceCoords.length; j = i++) {
                    const xi = geofenceCoords[i][0], yi = geofenceCoords[i][1];
                    const xj = geofenceCoords[j][0], yj = geofenceCoords[j][1];
                    const intersect = ((yi > y) !== (yi > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                    // Leaflet has a cleaner way if we had a polygon object, but manual check works too.
                }
                // Simpler Leaflet internal way:
                return polygon.getBounds().contains(latlng);
            };

            // 4. Markers & Sidebar
            const markers = {};
            const renderSidebar = () => {
                const list = document.getElementById('asset-list');
                list.innerHTML = '';
                
                // Static Assets
                assets.forEach(a => {
                    const item = createAssetItem(a);
                    list.appendChild(item);
                    markers[a.id] = L.marker([a.lat, a.lng], {
                        icon: L.divIcon({
                            className: 'custom-pin',
                            html: `<div class="pin-inner"></div><div class="pin-label">${a.id}</div>`,
                            iconSize: [20, 20], iconAnchor: [10, 10]
                        })
                    }).addTo(assetGroup);
                });

                // History Asset (Tracker 6)
                const t6Item = createAssetItem({
                    id: 'AssetTracker6', status: 'Moving', loc: 'Runway Approach', color: 'var(--color-accent)'
                }, true);
                list.appendChild(t6Item);
                
                markers['AssetTracker6'] = L.marker(historyPath[0], {
                    icon: L.divIcon({
                        className: 'custom-pin',
                        html: `<div class="pin-inner history-pin" id="pin-t6"></div><div class="pin-label">AssetTracker6</div>`,
                        iconSize: [20, 20], iconAnchor: [10, 10]
                    })
                }).addTo(historyGroup);
            };

            const createAssetItem = (a, isHistory = false) => {
                const div = document.createElement('div');
                div.className = 'asset-item';
                div.id = `sidebar-${a.id}`;
                div.innerHTML = `
                    <div class="asset-header">
                        <span class="asset-id">${a.id}</span>
                        <div class="status-badge" style="color:${a.color}">
                            <div class="status-dot" style="background:${a.color}"></div>
                            ${a.status}
                        </div>
                    </div>
                    <div style="font-size:11px; color:var(--color-text-secondary)">Current: ${a.loc}</div>
                    ${isHistory ? `<div class="notification-pill" id="notify-t6">
                        <strong>GEO-FENCE BREACH</strong><br>Entered: 08:00:12 · Left: 08:14:45
                    </div>` : ''}
                `;
                div.onclick = () => {
                    map.flyTo(markers[a.id].getLatLng(), 16);
                    document.querySelectorAll('.asset-item').forEach(el => el.classList.remove('active'));
                    div.classList.add('active');
                };
                return div;
            };

            // 5. Timeline Logic
            const slider = document.getElementById('timeline');
            const historyLine = L.polyline(historyPath, { color: 'var(--color-accent)', weight: 1, opacity: 0.3, dashArray: '5,5' }).addTo(historyGroup);

            const updateTimeline = (val) => {
                const progress = val / 100;
                const totalPoints = historyPath.length - 1;
                const pointIndex = Math.floor(progress * totalPoints);
                const nextIndex = Math.min(pointIndex + 1, totalPoints);
                const ratio = (progress * totalPoints) - pointIndex;

                const lat = historyPath[pointIndex][0] + (historyPath[nextIndex][0] - historyPath[pointIndex][0]) * ratio;
                const lng = historyPath[pointIndex][1] + (historyPath[nextIndex][1] - historyPath[pointIndex][1]) * ratio;
                
                const currentPos = [lat, lng];
                markers['AssetTracker6'].setLatLng(currentPos);

                // Update UI based on Geofence Breach
                const isInside = geofence.getBounds().contains(currentPos);
                const notify = document.getElementById('notify-t6');
                const pin = document.getElementById('pin-t6');
                
                if (isInside) {
                    notify.classList.add('visible');
                    if (pin) pin.classList.add('breached');
                } else {
                    notify.classList.remove('visible');
                    if (pin) pin.classList.remove('breached');
                }

                // Update Timestamp display
                const hours = Math.floor(8 + (val / 10));
                const mins = Math.floor((val % 10) * 6);
                document.getElementById('timeline-time').textContent = `TIMESTAMP: ${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:00`;
            };

            slider.addEventListener('input', (e) => updateTimeline(e.target.value));

            // 6. Layer Toggles
            document.getElementById('toggle-assets').addEventListener('change', e => e.target.checked ? map.addLayer(assetGroup) : map.removeLayer(assetGroup));
            document.getElementById('toggle-geofence').addEventListener('change', e => e.target.checked ? map.addLayer(geofence) : map.removeLayer(geofence));
            document.getElementById('toggle-history').addEventListener('change', e => e.target.checked ? map.addLayer(historyGroup) : map.removeLayer(historyGroup));

            // Initial Render
            renderSidebar();
            updateTimeline(0);

            map.on('move', () => {
                const c = map.getCenter();
                document.getElementById('coords').textContent = `${c.lat.toFixed(4)}° N, ${c.lng.toFixed(4)}° W`;
            });
        });
    </script>
</body>
</html>
